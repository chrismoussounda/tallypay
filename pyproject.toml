[project]
name = "tallypay"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2",
    "django-ninja>=1.8.0",
    "psycopg[binary]>=3.3.9",
    "qstash>=3.4.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "babel>=2.18.0",
    "django-stubs[compatible-mypy]>=6.1.2",
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "DJ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]
"config/settings.py" = ["S105"]
"scripts/*" = ["S603"]
"*/migrations/*" = ["RUF012"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
