{% load i18n %}<form class="theme" method="post" action="{% url 'set-theme' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% if theme == "dark" %}<button class="plain" name="theme" value="light" aria-label="{% translate "Light" %}"><span class="wide">{% translate "Light" %}</span><span class="short" aria-hidden="true">◐</span></button>{% else %}<button class="plain" name="theme" value="dark" aria-label="{% translate "Dark" %}"><span class="wide">{% translate "Dark" %}</span><span class="short" aria-hidden="true">◐</span></button>{% endif %}
</form>
