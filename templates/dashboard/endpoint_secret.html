{% load i18n shown %}
<h2 id="sheet-title">{% partialdef title inline %}{% translate "Signing secret" %}{% endpartialdef %}</h2>
<p class="break">{{ endpoint.url }}</p>
<form method="post" action="{{ request.path }}" hx-post="{{ request.path }}" hx-target="#sheet-body" hx-swap="innerHTML" hx-disabled-elt="find button" novalidate>
  {% csrf_token %}
  {% include "dashboard/fields.html" %}
  <button>{% translate "Show the secret" %}</button>
</form>
