{% load i18n shown %}
<h2 id="sheet-title">{% partialdef title inline %}{% translate "New payment" %}{% endpartialdef %}</h2>
<p class="dim">{% translate "The customer is asked to pay this amount." %}</p>
<form method="post" action="{{ request.path }}" hx-post="{{ request.path }}" hx-target="#sheet-body" hx-swap="innerHTML" hx-disabled-elt="find button" novalidate>
  {% csrf_token %}
  {% include "dashboard/fields.html" %}
  <button>{% translate "Create the payment" %}</button>
</form>
