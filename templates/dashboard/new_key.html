{% load i18n shown %}
<h2 id="sheet-title">{% partialdef title inline %}{% translate "New API key" %}{% endpartialdef %}</h2>
<p class="dim">{% translate "The key is shown once, then kept only in a form nobody can read." %}</p>
<form method="post" action="{{ request.path }}" hx-post="{{ request.path }}" hx-target="#sheet-body" hx-swap="innerHTML" hx-disabled-elt="find button" novalidate>
  {% csrf_token %}
  {% include "dashboard/fields.html" %}
  <button>{% translate "Create the key" %}</button>
</form>
