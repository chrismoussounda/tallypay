{% load i18n shown %}
<h2 id="sheet-title">{% partialdef title inline %}{% translate "Your new key" %}{% endpartialdef %}</h2>
<p>{% translate "Copy it now. It is never shown again." %}</p>
<p class="value"><code id="value">{{ value }}</code></p>
<p class="actions"><button type="button" class="second" data-copy="#value" data-copied="{% translate 'Copied' %}">{% translate "Copy" %}</button>
<a class="button" href="{% url back %}">{% translate "Done" %}</a></p>
