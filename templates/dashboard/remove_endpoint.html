{% load i18n shown %}
<h2 id="sheet-title">{% translate "Remove this address?" %}</h2>
<p class="break">{{ endpoint.url }}</p>
<p>{% translate "It is no longer told of anything. What was being sent to it stops." %}</p>
<form method="post" action="{{ request.path }}" hx-post="{{ request.path }}" hx-target="#sheet-body" hx-disabled-elt="find button" novalidate>
  {% csrf_token %}
  
  <button class="danger">{% translate "Remove the address" %}</button>
</form>
