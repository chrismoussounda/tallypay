{% load i18n %}<form class="theme" method="post" action="{% url 'set-theme' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% if theme == "dark" %}<button class="plain" name="theme" value="light" aria-label="{% translate "Light" %}"><span class="wide">{% translate "Light" %}</span><svg class="short" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>{% else %}<button class="plain" name="theme" value="dark" aria-label="{% translate "Dark" %}"><span class="wide">{% translate "Dark" %}</span><svg class="short" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>{% endif %}
</form>
