{% load static i18n %}{% get_current_language as LANGUAGE_CODE %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}" data-theme="{{ theme }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false,"historyCacheSize":0,"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true},{"code":"[45]..","swap":false,"error":true}]}'>
    <title>{% block title %}{% endblock %} · TallyPay</title>
    <link rel="icon" href="{% static 'favicon.ico' %}" sizes="32x32">
    <link rel="icon" href="{% static 'logo.svg' %}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{% static 'apple-touch-icon.png' %}">
    <link rel="preload" href="{% static 'fonts/besley-latin.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{% static 'fonts/public-sans-latin.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{% static 'dashboard.css' %}">
    <script src="{% static 'vendor/htmx-2.0.11.min.js' %}" defer></script>
    <script src="{% static 'dashboard.js' %}" defer></script>
  </head>
  <body data-error="{% translate 'That did not work. Try again.' %}">
    {% block body %}{% endblock %}
  </body>
</html>
